name: Agent Brains Tests
on:
  pull_request:
    paths:
      - 'src/agents/**'
      - 'src/server.ts'
      - '.github/workflows/agent-brains-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Run isolated agent brain tests
        run: bun test src/agents
