name: Project workspace tests

on:
  pull_request:
    paths:
      - "src/workspace/**"
      - "src/server.ts"
      - "package.json"
      - ".github/workflows/project-workspace-tests.yml"
  push:
    branches:
      - "feat/scotty-project-workspace"

jobs:
  workspace-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run agent and workspace tests
        run: bun test src/agents src/workspace
