name: SCOTTY Phase 5 Authorization — Synthetic Tests Only
on:
  pull_request:
    paths:
      - 'offline-brain/cloudflare-ipad/phase5-authorization/**'
      - '.github/workflows/scotty-phase5-authz-synthetic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ''
      OPENAI_API_KEY: ''
      GROQ_API_KEY: ''
      CLOUDFLARE_API_TOKEN: ''
      VERCEL_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check (no external services)
        run: node --check offline-brain/cloudflare-ipad/phase5-authorization/workspace-authorization-adapter.mjs
      - name: Synthetic authorization tests (no deployment)
        run: node --test offline-brain/cloudflare-ipad/phase5-authorization/workspace-authorization-adapter.test.mjs
