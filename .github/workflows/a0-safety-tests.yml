name: SCOTTY Stage A0 Safety Checks

on:
  pull_request:
    paths:
      - 'src/security/**'
      - 'scripts/a0-verify-roster.mjs'
      - '.github/workflows/a0-safety-tests.yml'
      - 'package.json'
  push:
    branches:
      - 'audit/stage-a0-foundation-20261107'
    paths:
      - 'src/security/**'
      - 'scripts/a0-verify-roster.mjs'
      - '.github/workflows/a0-safety-tests.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  a0-safety:
    name: A0 isolated security and auth tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute no-network, no-secrets A0 tests
        run: node --test src/security/*.test.mjs
