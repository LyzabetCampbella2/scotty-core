name: Mission biography projection synthetic QA
on:
  pull_request:
    paths:
      - 'offline-brain/cloudflare-ipad/project-mission-bio-projection*'
      - '.github/workflows/mission-bio-projection-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check offline-brain/cloudflare-ipad/project-mission-bio-projection.mjs
      - run: node --test offline-brain/cloudflare-ipad/project-mission-bio-projection.test.mjs
