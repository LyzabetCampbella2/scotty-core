name: SPOCK isolated chief profile — synthetic QA
on:
  pull_request:
    paths:
      - 'offline-brain/cloudflare-ipad/spock-brain.mjs'
      - 'offline-brain/cloudflare-ipad/spock-brain.test.mjs'
      - 'offline-brain/cloudflare-ipad/SPOCK_THREE_ROUND_PROFILE.md'
      - '.github/workflows/spock-brain-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Spock source
        run: node --check offline-brain/cloudflare-ipad/spock-brain.mjs
      - name: Run synthetic safety tests
        run: node --test offline-brain/cloudflare-ipad/spock-brain.test.mjs
