name: Remaining chiefs isolated synthetic QA
on:
  pull_request:
    paths:
      - 'offline-brain/cloudflare-ipad/remaining-chiefs.mjs'
      - 'offline-brain/cloudflare-ipad/remaining-chiefs.test.mjs'
      - 'offline-brain/cloudflare-ipad/REMAINING_17_CHIEFS.md'
      - '.github/workflows/remaining-chiefs-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check offline-brain/cloudflare-ipad/remaining-chiefs.mjs
      - run: node --test offline-brain/cloudflare-ipad/remaining-chiefs.test.mjs
