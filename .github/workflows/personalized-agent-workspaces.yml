name: Personalized agent workspaces synthetic tests
on:
  pull_request:
    paths:
      - 'offline-brain/cloudflare-ipad/personalized-agent-workspaces*'
      - '.github/workflows/personalized-agent-workspaces.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check offline-brain/cloudflare-ipad/personalized-agent-workspaces.mjs
      - run: node --test offline-brain/cloudflare-ipad/personalized-agent-workspaces.test.mjs
