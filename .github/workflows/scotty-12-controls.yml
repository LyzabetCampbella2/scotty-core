name: SCOTTY 12-part controls — synthetic safety tests
on:
  pull_request:
    paths:
      - 'src/brain/upgrade-checks*'
      - 'src/brain/upgrade-api*'
      - 'public/brain-operations-panel.js'
      - 'src/server-cloud-v2.ts'
      - '.github/workflows/scotty-12-controls.yml'
permissions:
  contents: read
jobs:
  synthetic-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      GROQ_API_KEY: ''
      SCOTTY_INDEPENDENT_BRAIN_ENABLED: 'false'
      SCOTTY_INDEPENDENT_BRAIN_TOKEN: ''
      SCOTTY_INDEPENDENT_BRAIN_AI_PROXY_ENABLED: 'false'
      CLOUDFLARE_API_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run review and privacy controls tests
        run: node --test src/brain/upgrade-checks.test.mjs src/brain/upgrade-api.test.mjs
      - name: Check HUD and server-side module syntax
        run: |
          node --check public/brain-operations-panel.js
          node --check src/brain/upgrade-checks.mjs
          node --check src/brain/upgrade-api.mjs
      - uses: oven-sh/setup-bun@v2
      - name: Bundle gateway without running or connecting to production
        run: |
          bun build src/server-cloud-v2.ts --target=bun --packages external --outfile=/tmp/scotty-12-controls.js
          test -s /tmp/scotty-12-controls.js
