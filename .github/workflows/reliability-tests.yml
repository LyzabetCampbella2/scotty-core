name: Reliability regression tests
on:
  pull_request:
  push:
    branches: [feature/reliability-control]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.22'
      - run: bun test src/reliability
