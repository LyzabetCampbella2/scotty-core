name: KIRK isolated chief brain — synthetic QA
on:
  pull_request:
    paths:
      - 'offline-brain/cloudflare-ipad/kirk-brain.mjs'
      - 'offline-brain/cloudflare-ipad/kirk-brain.test.mjs'
      - 'offline-brain/cloudflare-ipad/KIRK_THREE_ROUND_PROFILE.md'
      - '.github/workflows/kirk-brain-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kirk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check offline-brain/cloudflare-ipad/kirk-brain.mjs
      - run: node --test offline-brain/cloudflare-ipad/kirk-brain.test.mjs
