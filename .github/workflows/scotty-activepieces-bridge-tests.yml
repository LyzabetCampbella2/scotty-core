name: SCOTTY Activepieces — read-only staging bridge
on:
  pull_request:
    paths:
      - 'offline-brain/cloudflare-ipad/activepieces-bridge.mjs'
      - 'offline-brain/cloudflare-ipad/activepieces-bridge.test.mjs'
      - 'offline-brain/cloudflare-ipad/activepieces-owner-gate.mjs'
      - 'offline-brain/cloudflare-ipad/activepieces-owner-gate.test.mjs'
      - 'offline-brain/cloudflare-ipad/activepieces-review-readiness.mjs'
      - 'offline-brain/cloudflare-ipad/activepieces-review-readiness.test.mjs'
      - 'offline-brain/cloudflare-ipad/activepieces-review-ledger-v1.sql'
      - 'offline-brain/cloudflare-ipad/activepieces-review-schema.test.py'
      - 'offline-brain/cloudflare-ipad/activepieces-review-store.mjs'
      - 'offline-brain/cloudflare-ipad/activepieces-review-store.test.mjs'
      - 'offline-brain/cloudflare-ipad/worker.mjs'
      - 'activepieces/**'
      - '.github/workflows/scotty-activepieces-bridge-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax + permission tests
        run: |
          node --check offline-brain/cloudflare-ipad/worker.mjs
          node --check offline-brain/cloudflare-ipad/activepieces-bridge.mjs
          node --check offline-brain/cloudflare-ipad/activepieces-review-readiness.mjs
          node --check offline-brain/cloudflare-ipad/activepieces-review-store.mjs
          node --test offline-brain/cloudflare-ipad/activepieces-bridge.test.mjs offline-brain/cloudflare-ipad/activepieces-owner-gate.test.mjs offline-brain/cloudflare-ipad/activepieces-review-readiness.test.mjs offline-brain/cloudflare-ipad/activepieces-review-store.test.mjs activepieces/public-agent-directory.test.mjs activepieces/propose-team.test.mjs activepieces/prepare-review.test.mjs activepieces/orchestration-preview.test.mjs activepieces/mcp-build-manifest.test.mjs activepieces/audit-directory.test.mjs activepieces/public-portfolio-briefing.test.mjs activepieces/extract-task-inbox.test.mjs activepieces/project-team-preview.test.mjs activepieces/memory-access-preview.test.mjs activepieces/demo-approval-ledger.test.mjs activepieces/release-readiness.test.mjs
          python3 offline-brain/cloudflare-ipad/activepieces-review-schema.test.py
