name: SCOTTY Activepieces — read-only staging bridge
on:
  pull_request:
    paths:
      - 'offline-brain/cloudflare-ipad/activepieces-bridge.mjs'
      - 'offline-brain/cloudflare-ipad/activepieces-bridge.test.mjs'
      - 'offline-brain/cloudflare-ipad/worker.mjs'
      - 'activepieces/**'
      - '.github/workflows/scotty-activepieces-bridge-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax + permission tests
        run: |
          node --check offline-brain/cloudflare-ipad/worker.mjs
          node --check offline-brain/cloudflare-ipad/activepieces-bridge.mjs
          node --test offline-brain/cloudflare-ipad/activepieces-bridge.test.mjs activepieces/public-agent-directory.test.mjs activepieces/propose-team.test.mjs activepieces/prepare-review.test.mjs activepieces/orchestration-preview.test.mjs
