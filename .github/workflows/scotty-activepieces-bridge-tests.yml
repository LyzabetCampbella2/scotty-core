name: SCOTTY Activepieces — read-only staging bridge
on:
  pull_request:
    paths:
      - 'offline-brain/cloudflare-ipad/activepieces-bridge.mjs'
      - 'offline-brain/cloudflare-ipad/activepieces-bridge.test.mjs'
      - 'offline-brain/cloudflare-ipad/activepieces-owner-gate.mjs'
      - 'offline-brain/cloudflare-ipad/activepieces-owner-gate.test.mjs'
      - 'offline-brain/cloudflare-ipad/activepieces-review-readiness.mjs'
      - 'offline-brain/cloudflare-ipad/activepieces-review-readiness.test.mjs'
      - 'offline-brain/cloudflare-ipad/activepieces-review-ledger-v1.sql'
      - 'offline-brain/cloudflare-ipad/activepieces-review-schema.test.py'
      - 'offline-brain/cloudflare-ipad/activepieces-review-store.mjs'
      - 'offline-brain/cloudflare-ipad/activepieces-review-store.test.mjs'
      - 'offline-brain/cloudflare-ipad/owner-preview-review-api.mjs'
      - 'offline-brain/cloudflare-ipad/owner-preview-review-preflight.mjs'
      - 'offline-brain/cloudflare-ipad/owner-preview-review-api.test.mjs'
      - 'offline-brain/cloudflare-ipad/creative-media-department.mjs'
      - 'offline-brain/cloudflare-ipad/creative-media-department.test.mjs'
      - 'offline-brain/cloudflare-ipad/individual-agent-brains.mjs'
      - 'offline-brain/cloudflare-ipad/individual-agent-brains.test.mjs'
      - 'offline-brain/cloudflare-ipad/creative-agent-engine.mjs'
      - 'offline-brain/cloudflare-ipad/creative-agent-engine.test.mjs'
      - 'offline-brain/cloudflare-ipad/creative-agent-d1-store.mjs'
      - 'offline-brain/cloudflare-ipad/creative-agent-d1-store.test.mjs'
      - 'offline-brain/cloudflare-ipad/creative-agent-bio-api.mjs'
      - 'offline-brain/cloudflare-ipad/creative-agent-bio-api.test.mjs'
      - 'offline-brain/cloudflare-ipad/creative-workers-ai-provider.mjs'
      - 'offline-brain/cloudflare-ipad/creative-workers-ai-provider.test.mjs'
      - 'offline-brain/cloudflare-ipad/creative-project-assignment.mjs'
      - 'offline-brain/cloudflare-ipad/creative-project-assignment.test.mjs'
      - 'offline-brain/cloudflare-ipad/creative-memory-approval.mjs'
