name: TROI isolated chief brain — synthetic QA
on:
  pull_request:
    paths:
      - 'offline-brain/cloudflare-ipad/troi-brain.mjs'
      - 'offline-brain/cloudflare-ipad/troi-brain.test.mjs'
      - 'offline-brain/cloudflare-ipad/TROI_THREE_ROUND_PROFILE.md'
      - '.github/workflows/troi-brain-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  troi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check offline-brain/cloudflare-ipad/troi-brain.mjs
      - run: node --test offline-brain/cloudflare-ipad/troi-brain.test.mjs
