name: Agent Brains Render Staging
on:
  pull_request:
    paths:
      - 'src/agents/brain.ts'
      - 'src/agents/brain.test.ts'
      - 'src/agents/postgres-store.ts'
      - 'src/agents/postgres.integration.test.ts'
      - 'src/agents/collaboration.ts'
      - 'src/agents/collaboration-api.ts'
      - 'src/agents/collaboration-requests.ts'
      - 'src/agents/collaboration-inbox.ts'
      - 'src/agents/agent-credentials.ts'
      - 'src/agents/agent-runtime-api.ts'
      - 'src/agents/api.ts'
      - 'src/agents/render-bridge.ts'
      - 'src/agents/render-bridge.test.ts'
      - 'src/agents/review-ui.ts'
      - 'src/server-cloud-v2.ts'
      - '.github/workflows/agent-brains-render-staging.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: scotty_ci
          POSTGRES_PASSWORD: scotty_ci_password
          POSTGRES_DB: scotty_brain_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scotty_ci -d scotty_brain_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install isolated PostgreSQL test dependency
        run: |
          mkdir -p /tmp/scotty-agent-ci
          printf '{"dependencies":{"postgres":"^3.4.7"}}' > /tmp/scotty-agent-ci/package.json
          (cd /tmp/scotty-agent-ci && bun install)
          ln -s /tmp/scotty-agent-ci/node_modules node_modules
      - name: Unit tests for access isolation and fail-closed Render bridge
        run: bun test src/agents/brain.test.ts src/agents/render-bridge.test.ts
      - name: End-to-end PostgreSQL data integrity and learning reviews
        env:
          SCOTTY_BRAIN_TEST_DB: disposable
          DATABASE_URL: postgres://scotty_ci:scotty_ci_password@127.0.0.1:5432/scotty_brain_ci
          SCOTTY_BRAIN_DB_SSL: disable
        run: bun test src/agents/postgres.integration.test.ts
      - name: Import-check production router and Agent Brain storage
        run: bun -e "await import('./src/agents/postgres-store.ts'); await import('./src/agents/render-bridge.ts')"
