name: Agent Brains Render Staging
on:
  push:
    branches: [dev/ansjem-coordination-20261019, dev/ansjem-delivery-review-20261019, dev/ansjem-work-requests-20261019, dev/ipad-project-speech-recovery-20261019, review/agent-collaboration-part2-verification-20261018, dev/part3-project-missions-20261018, dev/part4-chief-coordination-20261018, dev/project-operations-20261018, dev/team-insights-20261018, dev/ipad-sandbox-documents-20261018, dev/original-hud-project-tools-20261019, dev/conversational-project-voice-20261019]
    paths: ['public/hud/ansjem-coordination-voice.js', 'public/hud/ansjem-delivery-voice.js', 'src/agents/**', 'public/render-hotfix.js', 'src/voice/cloud.ts', 'tests/voice-recovery.test.mjs', 'public/hud/project-operations.js', 'public/hud/project-sandbox.js', 'scripts/build-project-sandbox.ts', 'public/hud/sidebar-voice-live.js', 'public/index.html', '.github/workflows/agent-brains-render-staging.yml']
  pull_request:
    paths:
      - 'src/agents/ansjem-*'
      - 'public/hud/ansjem-work-voice.js'
      - 'public/hud/ansjem-delivery-voice.js'
      - 'public/hud/ansjem-coordination-voice.js'
      - 'public/render-hotfix.js'
      - 'src/voice/cloud.ts'
      - 'src/agents/scottish-*'
      - 'src/agents/voice-gateway*'
      - 'tests/voice-recovery.test.mjs'
      - 'src/agents/project-*'
      - 'public/hud/project-operations.js'
      - 'public/hud/project-sandbox.js'
      - 'scripts/build-project-sandbox.ts'
      - 'src/connectors/project-document-reader.ts'
      - 'public/hud/sidebar-voice-live.js'
      - 'public/index.html'
      - 'src/agents/project-mission*'
      - 'src/agents/mission-records.ts'
      - 'src/agents/chief-coordination*'
      - 'src/agents/workload.ts'
      - 'src/agents/collaboration-pagination.ts'
      - 'src/agents/brain.ts'
      - 'src/agents/brain.test.ts'
      - 'src/agents/postgres-store.ts'
      - 'src/agents/postgres.integration.test.ts'
      - 'src/agents/collaboration.ts'
      - 'src/agents/collaboration-lock.ts'
      - 'src/agents/roster-import.ts'
      - 'src/agents/cloud.ts'
      - 'src/agents/collaboration-api.ts'
      - 'src/agents/collaboration-requests.ts'
      - 'src/agents/collaboration-inbox.ts'
      - 'src/agents/agent-credentials.ts'
      - 'src/agents/agent-runtime-api.ts'
      - 'src/agents/api.ts'
      - 'src/agents/render-bridge.ts'
      - 'src/agents/render-bridge.test.ts'
      - 'src/agents/review-ui.ts'
      - 'src/server-cloud-v2.ts'
      - '.github/workflows/agent-brains-render-staging.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: scotty_ci
          POSTGRES_PASSWORD: scotty_ci_password
          POSTGRES_DB: scotty_brain_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scotty_ci -d scotty_brain_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - name: Install isolated PostgreSQL test dependency
        run: |
          mkdir -p /tmp/scotty-agent-ci
          printf '{"dependencies":{"postgres":"3.4.7","playwright":"1.62.1"}}' > /tmp/scotty-agent-ci/package.json
          (cd /tmp/scotty-agent-ci && bun install)
          ln -s /tmp/scotty-agent-ci/node_modules node_modules
      - name: Unit tests for access isolation and fail-closed Render bridge
        run: bun test src/agents/brain.test.ts src/agents/render-bridge.test.ts src/agents/project-mission-model.test.ts src/agents/project-draft-model.test.ts src/agents/project-documents.test.ts
      - name: Conversational project voice safety
        run: node --test src/agents/ansjem-coordination-voice.test.cjs src/agents/ansjem-delivery-voice.test.cjs src/agents/project-team-voice.test.cjs src/agents/ansjem-work-voice.test.cjs src/agents/scottish-playback.test.cjs src/agents/voice-gateway.test.cjs tests/voice-recovery.test.mjs
      - name: End-to-end PostgreSQL data integrity and learning reviews
        env:
          SCOTTY_BRAIN_TEST_DB: disposable
          DATABASE_URL: postgres://scotty_ci:scotty_ci_password@127.0.0.1:5432/scotty_brain_ci
          SCOTTY_BRAIN_DB_SSL: disable
        run: |
          bun test src/agents/postgres.integration.test.ts
          bun test src/agents/project-missions.integration.test.ts
          bun test src/agents/chief-coordination.integration.test.ts
          bun test src/agents/project-mission-legacy.integration.test.ts
          bun test src/agents/project-operations.integration.test.ts
          bun test src/agents/project-insights.integration.test.ts
          bun test src/agents/project-documents.integration.test.ts
          bun test src/agents/ansjem-work.integration.test.ts
          bun test src/agents/ansjem-delivery.integration.test.ts
          bun test src/agents/ansjem-coordination.integration.test.ts
      - name: Build browser-only synthetic project panels
        run: bun scripts/build-project-sandbox.ts /tmp/scotty-project-sandbox
      - name: Install Chromium and WebKit for synthetic tablet UI verification
        run: node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Synthetic tablet owner approval flow
        run: |
          bun test src/agents/project-mission-ui.browser.test.ts
          bun test src/agents/ansjem-coordination.browser.test.ts
          SCOTTY_UI_BROWSER=webkit bun test src/agents/ansjem-coordination.browser.test.ts
          bun test src/agents/ansjem-delivery.browser.test.ts
          SCOTTY_UI_BROWSER=webkit bun test src/agents/ansjem-delivery.browser.test.ts
          bun test src/agents/ansjem-work.browser.test.ts
          SCOTTY_UI_BROWSER=webkit bun test src/agents/ansjem-work.browser.test.ts
          bun test src/agents/project-operations.browser.test.ts
          bun test src/agents/scottish-playback.browser.test.ts
          SCOTTY_UI_BROWSER=webkit bun test src/agents/scottish-playback.browser.test.ts
          bun test src/agents/project-team-voice.browser.test.ts
          SCOTTY_UI_BROWSER=webkit bun test src/agents/project-team-voice.browser.test.ts
          SCOTTY_UI_BROWSER=webkit bun test src/agents/project-operations.browser.test.ts
          bun test src/agents/project-insights.browser.test.ts
          SCOTTY_UI_BROWSER=webkit bun test src/agents/project-insights.browser.test.ts
          bun test src/agents/project-sandbox.browser.test.ts
          SCOTTY_UI_BROWSER=webkit bun test src/agents/project-sandbox.browser.test.ts
      - name: Import-check production router and Agent Brain storage
        run: bun -e "await import('./src/agents/postgres-store.ts'); await import('./src/agents/render-bridge.ts')"


