name: Workspace owner auth boundary synthetic tests
on:
  pull_request:
    paths:
      - 'offline-brain/cloudflare-ipad/workspace-owner-auth-boundary*'
      - '.github/workflows/workspace-owner-auth-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check offline-brain/cloudflare-ipad/workspace-owner-auth-boundary.mjs
      - run: node --test offline-brain/cloudflare-ipad/workspace-owner-auth-boundary.test.mjs
