name: Living Starship safety tests
on:
  pull_request:
    paths:
      - "src/living-interface/**"
      - "src/server.ts"
      - ".github/workflows/starship-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --no-save
      - name: Run Living Starship safety tests
        run: bun test src/living-interface
