name: DATA isolated chief brain — synthetic QA
on:
  pull_request:
    paths:
      - 'offline-brain/cloudflare-ipad/data-brain.mjs'
      - 'offline-brain/cloudflare-ipad/data-brain.test.mjs'
      - 'offline-brain/cloudflare-ipad/DATA_THREE_ROUND_PROFILE.md'
      - '.github/workflows/data-brain-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source
        run: node --check offline-brain/cloudflare-ipad/data-brain.mjs
      - name: Run synthetic tests
        run: node --test offline-brain/cloudflare-ipad/data-brain.test.mjs
