<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scotty voice engine check</title><style>body{background:#051521;color:#d8edf6;font:16px system-ui;max-width:680px;margin:40px auto;padding:20px}button,a{color:#5eeaff;background:#12313b;border:1px solid #366275;padding:12px;border-radius:7px}p{line-height:1.5}audio{width:100%}</style><h1>Scotty voice engine check</h1><p>This checks Whisper and Kokoro on this device. First use downloads the models. It does not open your microphone, place a call, or send speech to a transcription service.</p><button id="test">LOAD AND TEST VOICE ENGINES</button><p id="status" role="status">Ready.</p><audio id="audio" controls></audio><p><a href="/">RETURN TO SCOTTY</a></p><script>
const button=document.querySelector('#test'),status=document.querySelector('#status'),audio=document.querySelector('#audio');let worker=null,url=null;button.onclick=()=>{button.disabled=true;status.textContent='Loading Whisper and Kokoro…';worker?.terminate();worker=new Worker('/calls-worker.js?v=1',{type:'module'});worker.onerror=()=>{status.textContent='This browser could not initialize the voice engines.';button.disabled=false;};worker.onmessage=({data:d})=>{if(d.progress){status.textContent='Loading • '+d.progress;return;}if(d.error){status.textContent=d.error;button.disabled=false;return;}if(d.id===1){status.textContent='Whisper and Kokoro loaded. Generating a voice test…';worker.postMessage({id:2,type:'speak',text:'Scotty voice engines are ready on this device.',voice:'bm_george'});}else if(d.id===2){const pcm=d.audio,buffer=new ArrayBuffer(44+pcm.length*2),view=new DataView(buffer),write=(n,s)=>{for(let i=0;i<s.length;i++)view.setUint8(n+i,s.charCodeAt(i));};write(0,'RIFF');view.setUint32(4,36+pcm.length*2,true);write(8,'WAVE');write(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,d.sampleRate,true);view.setUint32(28,d.sampleRate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);write(36,'data');view.setUint32(40,pcm.length*2,true);for(let i=0;i<pcm.length;i++)view.setInt16(44+i*2,Math.max(-1,Math.min(1,pcm[i]))*32767,true);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}));audio.src=url;status.textContent='Kokoro generated a voice test. Checking Whisper against that synthetic audio…';worker.postMessage({id:3,type:'transcribe',audio:resample(pcm,d.sampleRate)});}else if(d.id===3){status.textContent='Both voice engines work. Whisper heard: '+d.text+'. Press Play to hear Kokoro.';button.disabled=false;}};worker.postMessage({id:1,type:'init'});};function resample(input,rate){const step=rate/16000,out=new Float32Array(Math.floor(input.length/step));for(let i=0;i<out.length;i++){let sum=0,a=Math.floor(i*step),b=Math.floor((i+1)*step);for(let j=a;j<b;j++)sum+=input[j];out[i]=sum/Math.max(1,b-a);}return out;}
</script></html>
