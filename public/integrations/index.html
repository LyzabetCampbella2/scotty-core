<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>S.C.O.T.T.Y. Integrations</title>
<style>
:root{color-scheme:dark;--bg:#020812;--panel:#061521;--line:#17394b;--cyan:#5eeaff;--teal:#28d7bd;--amber:#ffd166;--red:#ff8ea4;--text:#def8ff;--muted:#819cab}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#0a2a3d 0,#020812 48%,#01050a 100%);color:var(--text);font:14px Inter,system-ui,-apple-system,sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:16px}.top,.panel{border:1px solid var(--line);background:rgba(5,18,29,.95);border-radius:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px}.brand{font-weight:800;letter-spacing:.28em}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.14em;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #2c5b72;background:#061a27;color:white;border-radius:8px;padding:9px 12px;font-size:10px;letter-spacing:.06em;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.panel{padding:14px}.provider{border:1px solid #153444;background:#04111b;border-radius:10px;padding:13px}.provider h3{margin:0 0 7px;font-size:13px}.state{float:right;font-size:9px;letter-spacing:.08em}.state.on{color:var(--teal)}.state.off{color:var(--amber)}.ops{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #244a5c;border-radius:999px;padding:4px 7px;font-size:9px;color:#aac6d4}.title{font-size:10px;letter-spacing:.14em;color:#91b1c0;text-transform:uppercase;margin-bottom:10px}.receipt{padding:10px 0;border-top:1px solid rgba(255,255,255,.07)}.receipt:first-child{border-top:0}.receipt b{font-size:11px}.receipt small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}.ok{color:var(--teal)}.bad{color:var(--red)}.empty{color:var(--muted);font-size:11px;padding:18px 4px}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">S.C.O.T.T.Y.<small>APP PROVIDERS • APPROVED EXECUTION • RECEIPTS</small></div><div class="actions"><a class="btn" href="/">HUD</a><a class="btn" href="/missions">MISSIONS</a><a class="btn" href="/system">OPERATIONS</a><button class="btn" id="refresh">REFRESH</button></div></div>
<div class="grid" id="providers"></div>
<section class="panel" style="margin-top:14px"><div class="title">Execution Receipts</div><div id="receipts">Loading…</div></section>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(u){const r=await fetch(u,{credentials:'same-origin',cache:'no-store'});if(r.status===401){location.href='/?next=/integrations';throw Error('Owner session required')}const d=await r.json();if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
async function load(){const d=await api('/api/providers');const p=d.providers||[],r=d.receipts||[];
document.querySelector('#providers').innerHTML=p.map(x=>'<div class="provider"><span class="state '+(x.configured?'on':'off')+'">'+(x.configured?'CONNECTED':'NEEDS CONNECTION')+'</span><h3>'+esc(x.label)+'</h3><div style="color:#819cab;font-size:10px">'+esc(x.note||'Approved mission actions use this provider when configured.')+'</div><div class="ops">'+(x.operations||[]).map(o=>'<span class="pill">'+esc(o)+'</span>').join('')+'</div></div>').join('');
document.querySelector('#receipts').innerHTML=r.length?r.map(x=>'<div class="receipt"><b>'+esc(x.provider.toUpperCase())+' • '+esc(x.operation)+'</b> <span class="'+(x.status==='completed'?'ok':'bad')+'">'+esc(x.status.toUpperCase())+'</span><small>'+esc(x.error||JSON.stringify(x.responseSummary||{}))+'<br>'+esc(new Date(x.createdAt).toLocaleString())+'</small></div>').join(''):'<div class="empty">No provider actions have executed yet.</div>'}
document.querySelector('#refresh').onclick=load;load();setInterval(load,20000);
</script></body></html>
