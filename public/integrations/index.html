<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>S.C.O.T.T.Y. Integrations</title>
<style>
:root{color-scheme:dark;--bg:#020812;--panel:#061521;--line:#17394b;--cyan:#5eeaff;--teal:#28d7bd;--amber:#ffd166;--red:#ff8ea4;--text:#def8ff;--muted:#819cab}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#0a2a3d 0,#020812 48%,#01050a 100%);color:var(--text);font:14px Inter,system-ui,-apple-system,sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:16px}.top,.panel{border:1px solid var(--line);background:rgba(5,18,29,.95);border-radius:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px}.brand{font-weight:800;letter-spacing:.28em}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.14em;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #2c5b72;background:#061a27;color:white;border-radius:8px;padding:9px 12px;font-size:10px;letter-spacing:.06em;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.panel{padding:14px}.provider{border:1px solid #153444;background:#04111b;border-radius:10px;padding:13px}.provider h3{margin:0 0 7px;font-size:13px}.state{float:right;font-size:9px;letter-spacing:.08em}.connect{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}.note{color:#819cab;font-size:10px;line-height:1.5}.setup{margin-top:10px;padding:9px;border:1px solid #684f22;background:#181204;border-radius:8px;color:#e7d18b;font-size:10px;line-height:1.45}.banner{margin-top:14px;border:1px solid #244a5c;background:#06131e;border-radius:10px;padding:10px 12px;font-size:11px;display:none}.banner.show{display:block}.banner.ok{border-color:#236d5e;color:#bffff0}.banner.bad{border-color:#6d3140;color:#ffc3cf}.state.on{color:var(--teal)}.state.off{color:var(--amber)}.ops{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #244a5c;border-radius:999px;padding:4px 7px;font-size:9px;color:#aac6d4}.title{font-size:10px;letter-spacing:.14em;color:#91b1c0;text-transform:uppercase;margin-bottom:10px}.receipt{padding:10px 0;border-top:1px solid rgba(255,255,255,.07)}.receipt:first-child{border-top:0}.receipt b{font-size:11px}.receipt small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}.ok{color:var(--teal)}.bad{color:var(--red)}.empty{color:var(--muted);font-size:11px;padding:18px 4px}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">S.C.O.T.T.Y.<small>APP PROVIDERS • APPROVED EXECUTION • RECEIPTS</small></div><div class="actions"><a class="btn" href="/">HUD</a><a class="btn" href="/missions">MISSIONS</a><a class="btn" href="/system">OPERATIONS</a><button class="btn" id="refresh">REFRESH</button></div></div>
<div id="banner" class="banner"></div><div class="grid" id="providers"></div>
<section class="panel" style="margin-top:14px"><div class="title">Execution Receipts</div><div id="receipts">Loading…</div></section>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',cache:'no-store',headers:{'content-type':'application/json',...(o.headers||{})},...o});if(r.status===401){location.href='/?next=/integrations';throw Error('Owner session required')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function showBanner(){
 const q=new URLSearchParams(location.search),b=document.querySelector('#banner'),state=q.get('google');
 if(state==='connected'){b.className='banner show ok';b.textContent='Google connected successfully. Gmail, Calendar, and Drive actions can now use the encrypted S.C.O.T.T.Y. credential vault.'}
 else if(state==='error'){b.className='banner show bad';b.textContent='Google connection failed: '+(q.get('message')||'Unknown error')}
}
function googleControls(conn,setup){
 if(conn?.configured)return '<div class="connect"><button class="btn" onclick="disconnectGoogle()">DISCONNECT GOOGLE</button></div><div class="note" style="margin-top:8px">Account: '+esc(conn.accountEmail||'Google account')+' • Refresh token: '+(conn.refreshCapable?'READY':'CHECK')+'</div>';
 if(setup?.vaultConfigured&&setup?.googleClientConfigured)return '<div class="connect"><a class="btn" href="/api/connections/google/start">CONNECT GOOGLE</a></div><div class="note" style="margin-top:8px">One Google authorization connects Gmail send, Calendar events, and Drive file creation.</div>';
 return '<div class="setup"><b>GOOGLE OAUTH SETUP REQUIRED</b><br>Render needs: SCOTTY_CONNECTION_KEY, GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET.<br><br>Authorized redirect URI:<br>'+esc(setup?.redirectUri||'https://scotty-cloud-hud.vercel.app/api/connections/google/callback')+'</div>';
}
async function disconnectGoogle(){if(!confirm('Disconnect Google from S.C.O.T.T.Y.?'))return;await api('/api/connections/google/disconnect',{method:'POST',body:'{}'});history.replaceState({},'',location.pathname);await load()}
async function load(){
 const [d,c]=await Promise.all([api('/api/providers'),api('/api/connections')]);const p=d.providers||[],r=d.receipts||[],google=c.connections?.google||{},setup=c.setup||{};
 document.querySelector('#providers').innerHTML=p.map(x=>{
  const controls=x.id==='google'?googleControls(google,setup):('<div class="note" style="margin-top:8px">'+(x.configured?'Provider credentials are configured on the cloud core.':'Connection workflow will be added after Google OAuth is verified.')+'</div>');
  return '<div class="provider"><span class="state '+(x.configured?'on':'off')+'">'+(x.configured?'CONNECTED':'NEEDS CONNECTION')+'</span><h3>'+esc(x.label)+'</h3><div class="note">'+esc(x.note||'Approved mission actions use this provider when configured.')+'</div><div class="ops">'+(x.operations||[]).map(o=>'<span class="pill">'+esc(o)+'</span>').join('')+'</div>'+controls+'</div>'
 }).join('');
 document.querySelector('#receipts').innerHTML=r.length?r.map(x=>'<div class="receipt"><b>'+esc(x.provider.toUpperCase())+' • '+esc(x.operation)+'</b> <span class="'+(x.status==='completed'?'ok':'bad')+'">'+esc(x.status.toUpperCase())+'</span><small>'+esc(x.error||JSON.stringify(x.responseSummary||{}))+'<br>'+esc(new Date(x.createdAt).toLocaleString())+'</small></div>').join(''):'<div class="empty">No provider actions have executed yet.</div>'
}
document.querySelector('#refresh').onclick=load;showBanner();load();setInterval(load,20000);
</script></body></html>
