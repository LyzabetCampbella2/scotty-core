# LOCAL LENOVO TEST ONLY. Bind to loopback; never publish the HTTP port.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false" # localhost HTTP only
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: America/Los_Angeles
      TZ: America/Los_Angeles
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
